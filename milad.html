<!DOCTYPE html>
<html lang="ml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>മീലാദ് സ്കോർബോർഡ്</title>
    <!-- Tailwind CSS ഉപയോഗിക്കുന്നു -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">

    <div class="max-w-md mx-auto">
        <h1 class="text-2xl font-bold text-center text-emerald-800 mb-6">മീലാദ് 2026</h1>

        <!-- 1. ME ബോക്സ് -->
        <div class="bg-white p-5 rounded-xl shadow-lg mb-4 border-l-4 border-emerald-500">
            <h2 class="text-xl font-bold text-emerald-700">ME</h2>
            <p class="text-sm text-gray-600">എന്റെ മത്സര ഫലങ്ങൾ</p>
            <div class="mt-3">
                <input type="text" placeholder="രജിസ്റ്റർ നമ്പർ" class="w-full p-2 border rounded mb-2">
                <button class="bg-emerald-600 text-white w-full py-2 rounded">ലോഗിൻ</button>
            </div>
        </div>

        <!-- 2. WE ബോക്സ് -->
        <div class="bg-white p-5 rounded-xl shadow-lg mb-4 border-l-4 border-sky-500">
            <h2 class="text-xl font-bold text-sky-700">WE</h2>
            <p class="text-sm text-gray-600">മത്സര വിജയികൾ</p>
            <button class="mt-3 text-sky-600 font-semibold underline">വിവരങ്ങൾ കാണുക</button>
        </div>

        <!-- 3. GE ബോക്സ് -->
        <div class="bg-white p-5 rounded-xl shadow-lg mb-4 border-l-4 border-amber-500">
            <h2 class="text-xl font-bold text-amber-700">GE</h2>
            <p class="text-sm text-gray-600">ടീം സ്കോർ ബോർഡ്</p>
            <button class="mt-3 text-amber-600 font-semibold underline">റാങ്കിംഗ് പരിശോധിക്കുക</button>
        </div>
    </div>

</body>
</html>
